apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-generator
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-generator
  template:
    metadata:
      labels:
        app: log-generator
    spec:
      containers:
        - name: log-generator
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) INFO User login successful"
                sleep 5

                echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) WARN API response time exceeded threshold"
                sleep 5

                echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) ERROR Database connection failed"
                sleep 5
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
