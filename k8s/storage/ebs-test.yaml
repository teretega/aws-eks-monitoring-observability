apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-test-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ebs-test-pod
  namespace: monitoring
spec:
  containers:
    - name: test-container
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "EBS storage test successful" > /data/test.txt
          sleep 36000
      volumeMounts:
        - name: test-storage
          mountPath: /data
  volumes:
    - name: test-storage
      persistentVolumeClaim:
        claimName: ebs-test-pvc
