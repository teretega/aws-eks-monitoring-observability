apiVersion: batch/v1
kind: Job
metadata:
  name: telemetrygen-traces
  namespace: monitoring
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: telemetrygen
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.163.0
          args:
            - traces
            - --otlp-insecure
            - --otlp-endpoint=otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317
            - --service=eks-observability-demo
            - --traces=100
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
